# 工业故障诊断多模态生成模型 - 训练配置

# 模型配置
model:
  # 文本编码器（LLaMA 或 GPT-2 作为备选）
  llama_ckpt: "gpt2"           # 如有本地 LLaMA 路径可改为 ./models/Llama-2-7b-hf
  hidden_dim: 256
  num_attention_heads: 8
  # 序列总长度 = text_length + accel_length + audio_length + temp_length
  length: 576
  text_length: 256
  accel_length: 128
  audio_length: 128
  temp_length: 64
  enable_cross_modal_attention: true

  # 加速度 VQ-VAE 配置
  accel_vqvae:
    input_dim: 3          # 三轴加速度
    hidden_dim: 128
    num_embeddings: 1024
    embedding_dim: 32

  # 音频 VQ-VAE 配置
  audio_vqvae:
    input_dim: 120        # 梅尔频谱维度
    hidden_dim: 128
    num_embeddings: 1024
    embedding_dim: 32

  # 温度 VQ-VAE 配置
  temp_vqvae:
    input_dim: 1          # 单通道温度
    hidden_dim: 64
    num_embeddings: 512
    embedding_dim: 16

# 数据配置
data:
  train_data_dir: "./data/train"
  val_data_dir: "./data/val"

# DataLoader 配置
loader:
  batch_size: 4
  eval_batch_size: 4

# 训练器配置
trainer:
  num_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  save_every: 10           # 每 N 个 epoch 保存一次
  eval_every: 5            # 每 N 个 epoch 评估一次
  precision: "no"          # accelerate mixed_precision: no / fp16 / bf16
  gradient_clip: 1.0
  loss_weights:
    modality_balance: 0.1
    temporal_alignment: 0.2
    class_balance: 0.15
    knowledge_consistency: 0.1

# 检查点配置
checkpoint:
  save_dir: "./outputs"
  best_model_name: "best_model.pt"
  signal_tokenizer_path: "./outputs/signal_tokenizer"

# 日志配置
logging:
  log_every: 50            # 每 N 步打印一次日志
  use_tensorboard: false
  tensorboard_dir: "./runs"
